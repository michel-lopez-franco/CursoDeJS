<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Tareas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="encabezado">
      <h1>Lista de Tareas</h1>
      <button id="btnTema" type="button" aria-label="Cambiar entre modo claro y oscuro">🌙 Modo oscuro</button>
    </header>

    <!-- Mejora 2: aviso de tareas por vencer -->
    <section id="porVencer" class="por-vencer" hidden>
      <h2>⏰ Por vencer</h2>
      <ul id="listaPorVencer"></ul>
    </section>

    <form id="formTarea" class="form-tarea">
      <input type="text" id="textoTarea" placeholder="Escribe una tarea..." required maxlength="100">
      <!-- Mejora 3: categoría -->
      <select id="categoriaTarea" aria-label="Categoría">
        <option value="Trabajo">Trabajo</option>
        <option value="Personal">Personal</option>
        <option value="Estudio">Estudio</option>
        <option value="Otro">Otro</option>
      </select>
      <!-- Mejora 2: fecha límite -->
      <input type="date" id="fechaTarea" aria-label="Fecha límite">
      <button type="submit">Añadir</button>
    </form>

    <div class="filtro">
      <label for="filtroCategoria">Mostrar:</label>
      <select id="filtroCategoria">
        <option value="Todas">Todas las categorías</option>
        <option value="Trabajo">Trabajo</option>
        <option value="Personal">Personal</option>
        <option value="Estudio">Estudio</option>
        <option value="Otro">Otro</option>
      </select>
    </div>

    <ul id="listaTareas" class="lista"></ul>
    <p id="vacio" class="vacio" hidden>No hay tareas aquí todavía. Añade la primera.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
