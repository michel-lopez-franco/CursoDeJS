<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Tareas Avanzado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Mis Tareas</h1>
      <button id="theme-toggle" class="btn-theme" title="Cambiar tema">🌙 Modo Oscuro</button>
    </header>

    <!-- Formulario para agregar tareas -->
    <form id="task-form">
      <input type="text" id="task-input" placeholder="¿Qué necesitas hacer?" required>
      <input type="date" id="task-date" required>
      <select id="task-category">
        <option value="Personal">Personal</option>
        <option value="Trabajo">Trabajo</option>
        <option value="Estudio">Estudio</option>
        <option value="Hogar">Hogar</option>
      </select>
      <button type="submit" class="btn-add">Agregar</button>
    </form>

    <!-- Filtros rápidos -->
    <div class="filters">
      <button class="filter-btn active" data-filter="todas">Todas</button>
      <button class="filter-btn" data-filter="por-vencer">⚠️ Por vencer (Próx. 3 días)</button>
      <select id="category-filter">
        <option value="todas">Todas las categorías</option>
        <option value="Personal">Personal</option>
        <option value="Trabajo">Trabajo</option>
        <option value="Estudio">Estudio</option>
        <option value="Hogar">Hogar</option>
      </select>
    </div>

    <!-- Lista de tareas -->
    <ul id="task-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
